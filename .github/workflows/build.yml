name: Build Rasmna APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

      # ✅ فك تشفير الـ Keystore
      - name: Decode Keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > android/app/rasmna-upload.jks
          SIZE=$(stat -c%s android/app/rasmna-upload.jks)
          if [ "$SIZE" -lt 1000 ]; then
            echo "❌ Keystore too small ($SIZE bytes)"
            exit 1
          fi
          echo "✅ Keystore ready ($SIZE bytes)"

      # ✅ استخراج الـ Alias تلقائياً من الـ Keystore (يتجاوز مشكلة KEY_ALIAS)
      - name: Auto-detect Keystore Alias
        id: keystore_info
        run: |
          KEYSTORE="android/app/rasmna-upload.jks"
          KEYSTORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"

          echo "═══════════════════════════════════════"
          echo "🔍 Keystore contents:"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASS" 2>&1 | head -40 || true
          echo "═══════════════════════════════════════"

          # استخراج أول PrivateKeyEntry
          ALIAS=$(keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASS" 2>/dev/null \
            | grep -i "PrivateKeyEntry" \
            | head -1 \
            | cut -d',' -f1 \
            | xargs)

          if [ -z "$ALIAS" ]; then
            echo "⚠️ Auto-detection failed, falling back to KEY_ALIAS secret"
            ALIAS="${{ secrets.KEY_ALIAS }}"
          fi

          echo "✅ Detected alias: '$ALIAS'"
          echo "alias=$ALIAS" >> $GITHUB_OUTPUT

      # ✅ إنشاء key.properties باستخدام الـ Alias المستخرج
      - name: Create key.properties
        run: |
          ALIAS="${{ steps.keystore_info.outputs.alias }}"
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=$ALIAS
          storeFile=rasmna-upload.jks
          EOF
          echo "✅ key.properties created"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Verify outputs
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rasmna-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: rasmna-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
