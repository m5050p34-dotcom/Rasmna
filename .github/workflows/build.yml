name: Build Rasmna APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Android SDK Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" || true

      - name: Decode Keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > android/app/rasmna-upload.jks
          ls -lh android/app/rasmna-upload.jks
          file android/app/rasmna-upload.jks || true
          SIZE=$(stat -c%s android/app/rasmna-upload.jks)
          if [ "$SIZE" -lt 1000 ]; then
            echo "❌ Keystore too small ($SIZE bytes) — Secret corrupted!"
            exit 1
          fi
          echo "✅ Keystore size: $SIZE bytes"

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=rasmna-upload.jks
          EOF
          echo "✅ key.properties created"

      - name: Clean old caches
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf android/.gradle/
          rm -rf android/build/
          rm -rf build/
          rm -rf .dart_tool/

      - name: Get dependencies
        run: flutter pub get

      - name: Build Signed Universal APK
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk && echo "✅ APK built successfully"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rasmna-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
