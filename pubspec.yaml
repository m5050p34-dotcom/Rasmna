name: rasmna
description: "Rasmna - Professional Photo Marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.3.0
  intl: ^0.20.3
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  image_gallery_saver_plus: ^4.0.1
  permission_handler: ^11.3.1
  http: ^1.2.2
  url_launcher: ^6.3.0

  # ═══════════════════════════════════════════════
  # 🎬 Google Mobile Ads + Unity Mediation
  # ═══════════════════════════════════════════════
  google_mobile_ads: ^9.1.0
  gma_mediation_unity: ^1.10.0

  # ═══════════════════════════════════════════════
  # 🔔 Local Notifications
  # ═══════════════════════════════════════════════
  flutter_local_notifications: ^17.2.3+2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
